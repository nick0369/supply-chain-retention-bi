name: Replay historical ETL
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: operations-bi build
      - uses: actions/upload-artifact@v4
        with:
          name: historical-etl-report
          path: |
            reports/
            dashboard/
