services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operations
      POSTGRES_USER: operations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - operations_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations -d operations"]
      interval: 5s
      retries: 10
volumes:
  operations_data:
